<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Email!</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,400&family=Anonymous+Pro&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Space Mono', monospace; /* Applied Space Mono font */
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
            font-style: italic; /* Italicized Space Mono */
        }
        h2 {
            font-family: 'Anonymous Pro', monospace; /* Applied Anonymous Pro font */
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .otp-box {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 1.5rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: #333;
            color: white;
            outline: none;
            font-family: 'Space Mono', monospace; /* Applied Space Mono font to OTP boxes */
        }
        .otp-box:focus {
            border-color: #6a4c93;
        }
        .error-message {
            color: red;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Space Mono', monospace; /* Apply Space Mono font to error */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Email Email!</h1>
    <h2>Currently invite only. Enter your code:</h2>
    <div class="otp-container">
        <!-- Six separate input boxes for OTP -->
        <input type="text" class="otp-box" maxlength="1" id="otp1" oninput="moveFocus(1)" onkeydown="handleBackspace(event, 1)">
        <input type="text" class="otp-box" maxlength="1" id="otp2" oninput="moveFocus(2)" onkeydown="handleBackspace(event, 2)">
        <input type="text" class="otp-box" maxlength="1" id="otp3" oninput="moveFocus(3)" onkeydown="handleBackspace(event, 3)">
        <input type="text" class="otp-box" maxlength="1" id="otp4" oninput="moveFocus(4)" onkeydown="handleBackspace(event, 4)">
        <input type="text" class="otp-box" maxlength="1" id="otp5" oninput="moveFocus(5)" onkeydown="handleBackspace(event, 5)">
        <input type="text" class="otp-box" maxlength="1" id="otp6" oninput="submitInviteCode()" onkeydown="handleBackspace(event, 6)">
    </div>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
    // Function to move the focus to the next input box
    function moveFocus(index) {
        const currentBox = document.getElementById(`otp${index}`);
        if (currentBox.value.length === 1 && index < 6) {
            document.getElementById(`otp${index + 1}`).focus();
        }
    }

    // Function to handle backspace behavior to move focus backwards
    function handleBackspace(event, index) {
        if (event.key === "Backspace" && index > 1 && document.getElementById(`otp${index}`).value === "") {
            document.getElementById(`otp${index - 1}`).focus();
        }
    }

    // Function to simulate automatic submission when the sixth box is filled
    function submitInviteCode() {
        const otpValues = [];
        for (let i = 1; i <= 6; i++) {
            otpValues.push(document.getElementById(`otp${i}`).value);
        }
        const otpCode = otpValues.join('');
        
        const errorMessageElement = document.getElementById('errorMessage');
        
        if (otpCode.length === 6) {
            // Simulating an invalid code submission
            errorMessageElement.textContent = "That code was invalid";
        } else {
            // If not all fields are filled, show an error message
            errorMessageElement.textContent = "Please enter all digits.";
        }
    }
</script>

</body>
</html>
